<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Vertew Hologram AI</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/hologram.css" />
    <link rel="icon" href="data:," />
  </head>
  <body data-display="hologram" data-state="idle" data-hologram-state="idle">
    <main id="stage">
      <div class="top-bar">
        <div class="vertew-logo">VERTEW <span>HOLOGRAM AI</span></div>
        <div class="system-state">
          <i id="connection-dot"></i><span id="state-label">Idle</span>
          <select id="language-label" class="language-select" aria-label="Response language">
            <option value="en">EN</option>
            <option value="ko">한국어</option>
            <option value="ms">BM</option>
          </select>
        </div>
      </div>

      <aside id="order-board" aria-label="Current order status">
        <div class="order-board-head">ORDER STATUS</div>
        <div id="order-board-list" class="order-board-list"></div>
      </aside>

      <section id="character" aria-label="Vertew bird character">
        <div class="vertew-rig" role="img" aria-label="Animated 3D Vertew toucan character">
          <canvas class="vertew-canvas"></canvas>
          <img class="vertew-effect vertew-question" src="./assets/character/processed/question.png" alt="" />
          <img class="vertew-effect vertew-emotion-accent" alt="" />
        </div>
      </section>

      <video id="hologram-video" playsinline preload="metadata"></video>

      <section class="hero-copy">
        <p>STREET FOOD</p>
        <h1>Hi there!</h1>
        <span>Come check out our nasi goreng!</span>
      </section>

      <button id="qr-panel" class="qr-panel" aria-label="Open order QR code">
        <img class="session-qr" alt="Scan to order" />
        <span>SCAN TO ORDER</span>
      </button>

      <section class="qr-overlay" aria-label="Order QR code">
        <button id="qr-close" aria-label="Close QR code">×</button>
        <p>SCAN TO ORDER</p>
        <img class="session-qr" alt="Scan QR code to order" />
        <a id="qr-link" class="qr-link" target="_blank" rel="noopener"></a>
        <span>No app needed</span>
      </section>

      <section class="ready-overlay">
        <div class="ready-spark">✦</div>
        <p>ORDER READY</p>
        <strong id="ready-number">#12</strong>
        <h2 id="ready-message">Your order is ready!</h2>
      </section>

      <div id="listen-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="live-caption"></div>
      <aside id="chat-log"></aside>
      <div id="boot-error"></div>

      <aside id="debug-panel">
        <div class="debug-head"><b>DEMO CONTROLS</b><button id="mode-toggle">Tablet Mode</button></div>
        <div class="debug-grid">
          <button data-debug-event="customer_detected" data-distance="180">Customer Detected</button>
          <button data-debug-event="customer_close" data-distance="70">Customer Close</button>
          <button data-debug-event="keyword_detected">Keyword Detected</button>
          <button data-debug-event="show_qr">Show QR</button>
          <button id="debug-ko">Korean Speech</button><button id="debug-en">English Speech</button>
          <button id="debug-ms">Malay Speech</button><button id="debug-ready">Order Ready Event</button>
        </div>
        <form id="debug-transcript-form" class="debug-transcript-form">
          <input id="debug-transcript-input" type="text" placeholder="Type a message (bypasses the mic)" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </aside>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
